# ==============================================================================
# Composite symbols
# ==============================================================================

SENDER_FROM_EN_TEAM_STRICT {
  expression = "sender.from.en.team.base & !sender.from.en.team.allow";
  score = 12.0;
  description = "Sender: Team marker without allowlisted brands";
}

# Team pattern with explicit allowlist handled via composite rule
sender.from.en.team.base {
  type = "header";
  header = "from";
  filter = "email:name";
  regexp = true;
  map = "https://raw.githubusercontent.com/martinschaible/rspamd-rules/main/maps.d/sender/en/sender.from.en.team.base.map";
  score = 0;
  symbol = "sender.from.en.team.base";
  description = "Sender: Team marker (base), english";
}

sender.from.en.team.allow {
  type = "header";
  header = "from";
  filter = "email:name";
  regexp = true;
  map = "https://raw.githubusercontent.com/martinschaible/rspamd-rules/main/maps.d/sender/en/sender.from.en.team.allow.map";
  score = 0;
  symbol = "sender.from.en.team.allow";
  description = "Sender: Team marker allowlist, english";
}
