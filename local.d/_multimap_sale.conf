sale_subject_de {
  type = "header";
  header = "subject";
  regexp = true;
  one_shot = true;
  map = "https://raw.githubusercontent.com/martinschaible/rspamd-rules/main/maps.d/legacy/_sale_subject_de.map";
  score = 12.0;
  symbol = "SALE_SUBJECT_DE";
  description = "Sale: Subject, german";
}

