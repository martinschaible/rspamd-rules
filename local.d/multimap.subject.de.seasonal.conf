# ==============================================================================
# Subject: Seasonal
# ------------------------------------------------------------------------------
# Some Spam attacks occur regularly but are short-lived.
#
# Therefore, any RexEx filters have a limited lifespan.
# The topics cover everything from scams and phishing to sales.
#
# Such rules belong here.
#
# ------------------------------------------------------------------------------
# Language : german
# Weighting: LOW:     6          In the configuration of SmarterMail we use
#            MEDIUM: 12          the scoring factor 1.67 to reach the weighting
#            HIGH:   18          of 10, 20 and 30.
# ==============================================================================

# Generic
# ------------------------------------------------------------------------------
subject.de.seasonal {
  type = "header";
  header = "subject";
  regexp = true;
  map = "https://raw.githubusercontent.com/martinschaible/rspamd-rules/main/maps.d/subject/de/subject.de.seasonal.map";
  score = 12.0;
  symbol = "subject.de.seasonal";
  description = "Subject: Seasonal, german";
}
